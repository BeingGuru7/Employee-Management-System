<!DOCTYPE html>
<html>
<head>
    <title>EMS</title>
    <style>
        body {
            font-family: Arial;
            background: #f4f6f8;
            padding: 20px;
        }

        h2 {
            text-align: center;
        }

        .container {
            width: 400px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            width: 95%;
            padding: 8px;
            margin: 5px 0;
        }

        button {
            padding: 8px 12px;
            margin-top: 10px;
            cursor: pointer;
        }

        .employee {
            background: #e3f2fd;
            margin-top: 10px;
            padding: 10px;
            border-radius: 5px;
        }

        .delete-btn {
            background: red;
            color: white;
            border: none;
            float: right;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Management</h2>

    <input id="name" placeholder="Name">
    <input id="email" placeholder="Email">
    <input id="dept" placeholder="Department">

    <button onclick="addEmployee()">Add Employee</button>

    <h3>Employee List</h3>
    <div id="list"></div>
</div>

<script src="script.js"></script>

</body>
</html>
